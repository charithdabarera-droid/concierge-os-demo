  <style>
:root {
  --bg: #f4efe6;
  --bg-2: #ece5d8;
  --surface: #fffdf8;
  --surface-2: #f8f3ea;
  --ink: #1c1915;
  --muted: #6b645a;
  --line: #e3d9c8;
  --line-strong: #cfc3ad;
  --accent: #2c4a42;
  --accent-ink: #f4efe6;
  --gold: #8a6a3a;
  --gold-soft: #d4b483;
  --overdue: #9c3a2c;
  --overdue-bg: #f8e8e4;
  --ok: #2c6e4f;
  --ok-bg: #e4f0e9;
  --progress: #8a6a3a;
  --progress-bg: #f3ead8;
  --closed: #6b645a;
  --shadow: 0 10px 30px rgba(28, 25, 21, 0.08);
  --shadow-lg: 0 24px 60px rgba(28, 25, 21, 0.16);
  --radius: 14px;
  --radius-sm: 8px;
  --font: "Outfit", "Segoe UI", system-ui, sans-serif;
  --serif: "Fraunces", "Palatino Linotype", Palatino, Georgia, serif;
  --topbar: 64px;
  --bottom: 0px;
  --sidebar: 268px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #161412;
  --bg-2: #1e1b18;
  --surface: #221f1b;
  --surface-2: #2a2621;
  --ink: #f3eee6;
  --muted: #a89f92;
  --line: #3a342c;
  --line-strong: #52493d;
  --accent: #c9a46a;
  --accent-ink: #1c1915;
  --gold: #d4b483;
  --gold-soft: #8a6a3a;
  --overdue: #f0a398;
  --overdue-bg: #3a221f;
  --ok: #8fcead;
  --ok-bg: #1d3228;
  --progress: #e2c48a;
  --progress-bg: #3a3120;
  --closed: #a89f92;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
[data-theme="dark"] .icon-sun { display: none; }
[data-theme="light"] .icon-moon, :root:not([data-theme="dark"]) .icon-moon { display: none; }
[data-theme="dark"] .icon-moon { display: block; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: 0.01em;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-family: var(--font); font-weight: 600; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

#app { min-height: 100%; display: flex; flex-direction: column; }
#main { flex: 1; padding-bottom: var(--bottom); }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar);
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px 0 18px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.brand-mark { border-radius: 7px; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; }
.brand-text span { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em; }
.main-nav { display: flex; gap: 2px; flex: 1; justify-content: center; }
.main-nav button, .bottom-nav button {
  border: 0; background: transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 999px; font-weight: 500;
}
.main-nav button:hover, .bottom-nav button:hover { background: var(--bg-2); color: var(--ink); }
.main-nav button.active, .bottom-nav button.active { background: var(--accent); color: var(--accent-ink); }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
}
.icon-btn:hover { border-color: var(--line-strong); background: var(--bg-2); }
.menu-btn { display: none; }
.punch-btn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; font-weight: 500;
}
.punch-btn.on { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.user-switcher select {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 28px 6px 12px; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236b645a' d='M1 1l5 5 5-5'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; max-width: 180px;
}

/* Buttons */
.btn {
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 10px; padding: 8px 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--bg-2); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-danger { background: var(--overdue); color: #fff; border-color: transparent; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--bg-2); color: var(--ink); }
.text-btn { border: 0; background: none; color: var(--gold); font-size: 0.75rem; font-weight: 600; padding: 0; }
.split-btn { position: relative; display: inline-flex; }
.split-btn .btn { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split-btn .btn-caret {
  border-top-left-radius: 0; border-bottom-left-radius: 0;
  border-left: 1px solid color-mix(in srgb, var(--accent-ink) 25%, transparent);
  padding-left: 8px; padding-right: 8px; min-width: 32px;
}
.split-btn .btn:not(.btn-primary) + .btn-caret { border-left-color: var(--line-strong); }
.fav-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  min-width: 260px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px;
}
.fav-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 8px 10px; border-radius: 6px; font-size: 0.9rem;
}
.fav-menu button:hover { background: var(--bg-2); }
.fav-menu .fav-meta { display: block; font-size: 0.7rem; color: var(--muted); }

/* Views */
.view { padding: 20px 24px 40px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.lede { color: var(--muted); margin-top: 4px; }

/* Dashboard */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 18px 16px; box-shadow: var(--shadow);
}
.stat-card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.stat-card .num { font-family: var(--serif); font-size: 2.2rem; margin-top: 6px; line-height: 1; }
.stat-card.overdue .num { color: var(--overdue); }
.stat-card.open .num { color: var(--ok); }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.panel h2 { margin-bottom: 14px; }
.dept-row { display: grid; grid-template-columns: 120px 1fr 28px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 0.88rem; }
.bar { height: 8px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; }
.list-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer;
}
.list-row:last-child { border-bottom: 0; }
.list-row:hover { color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.muted { color: var(--muted); font-size: 0.82rem; }
.empty { color: var(--muted); padding: 28px 8px; text-align: center; }

/* Tickets layout */
.tickets-view { display: grid; grid-template-columns: var(--sidebar) 1fr; gap: 20px; padding: 16px 16px 40px 12px; align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--topbar) + 16px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
}
.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.close-sidebar { display: none; }
.sidebar-block { margin-top: 18px; }
.block-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.filter-list, .quick-links { display: flex; flex-direction: column; gap: 2px; }
.filter-list button, .quick-links button, .chip {
  border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 8px; color: var(--ink);
}
.filter-list button:hover, .quick-links button:hover, .chip:hover { background: var(--bg-2); }
.filter-list button.active { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); font-weight: 600; }
.filter-list .count, .chip .count { float: right; color: var(--muted); font-size: 0.75rem; }
.quick-links button { font-size: 0.86rem; }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head strong { font-family: var(--serif); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grid .dow { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; padding: 4px 0; text-transform: uppercase; }
.cal-grid button {
  border: 0; background: transparent; border-radius: 8px; height: 32px; position: relative; font-size: 0.8rem;
}
.cal-grid button:hover { background: var(--bg-2); }
.cal-grid button.today { box-shadow: inset 0 0 0 1px var(--gold); }
.cal-grid button.selected { background: var(--accent); color: var(--accent-ink); }
.cal-grid button.outside { color: var(--line-strong); }
.cal-grid button.has-tickets::after {
  content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--gold);
  position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
}
.cal-grid button.selected.has-tickets::after { background: var(--accent-ink); }

/* Toolbar */
.tickets-main { min-width: 0; }
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.create-cluster, .toolbar-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; color: var(--muted); font-size: 0.82rem; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.active { background: var(--ink); color: var(--bg); }
.search-field { flex: 1; min-width: 180px; }
.search-field.wide { min-width: 260px; max-width: 420px; }
.search-field input, .field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 8px 12px; outline: none;
}
.search-field input:focus, .field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent);
}
.chip-bar { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; margin-bottom: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line) !important; border-radius: 999px; padding: 4px 8px 4px 10px; font-size: 0.78rem;
}
.chip .x { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 1rem; line-height: 1; }

/* Timeline */
.tickets-board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.board-meta { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; display: flex; justify-content: space-between; }
.hour-block { display: grid; grid-template-columns: 64px 1fr; border-bottom: 1px solid var(--line); }
.hour-block:last-child { border-bottom: 0; }
.hour-block.empty { opacity: 0.55; }
.hour-label {
  padding: 10px 8px 10px 14px; font-size: 0.75rem; font-weight: 600; color: var(--muted);
  border-right: 1px solid var(--line); background: var(--surface-2);
}
.hour-tickets { padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 20px; }
.ticket-row {
  display: grid; grid-template-columns: 64px 1fr auto auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--bg);
  border: 1px solid transparent; border-left: 4px solid var(--dept, var(--gold));
  cursor: pointer; text-align: left;
}
.ticket-row:hover { border-color: var(--line-strong); border-left-color: var(--dept, var(--gold)); }
.ticket-row.overdue { background: var(--overdue-bg); }
.ticket-row.closed { opacity: 0.62; }
.ticket-row .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.82rem; }
.ticket-row .sum { min-width: 0; }
.ticket-row .sum strong { display: block; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket-row .sum span { color: var(--muted); font-size: 0.75rem; }
.pill {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px;
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--bg-2); color: var(--muted); white-space: nowrap;
}
.pill.open { background: var(--ok-bg); color: var(--ok); }
.pill.in_progress { background: var(--progress-bg); color: var(--progress); }
.pill.closed { background: var(--bg-2); color: var(--closed); }
.pill.overdue { background: var(--overdue); color: #fff; }
.pill.guest { background: #e7eef2; color: #3b6e8a; }
.pill.internal { background: #f1eadf; color: #8a6a3a; }
[data-theme="dark"] .pill.guest { background: #1e2c34; color: #8eb6c8; }
[data-theme="dark"] .pill.internal { background: #32291c; color: #d4b483; }
.assignee { font-size: 0.75rem; color: var(--muted); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Ticket cards (mobile / all-time list) */
.ticket-list { display: flex; flex-direction: column; }
.ticket-card {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; padding: 14px 16px; border-left: 4px solid var(--dept, var(--gold));
  cursor: pointer;
}
.ticket-card:hover { background: var(--bg); }
.ticket-card.overdue { background: var(--overdue-bg); }
.ticket-card .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ticket-card h4 { font-family: var(--font); font-size: 0.95rem; font-weight: 550; margin: 0; }
.ticket-card .meta { color: var(--muted); font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 8px; }

/* Guests */
.table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tr { cursor: pointer; }
tr:hover td { background: var(--bg); }
tr:last-child td { border-bottom: 0; }

/* Staff / tasks */
.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.staff-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: flex-start;
}
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; font-size: 0.85rem;
}
.staff-card.current { outline: 2px solid var(--gold); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--line-strong); }
.status-dot.on { background: var(--ok); }

/* Drawer + modal */
.drawer-backdrop, .modal-backdrop, .sidebar-backdrop {
  position: fixed; inset: 0; background: rgba(28, 25, 21, 0.4); z-index: 50;
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
  background: var(--surface); z-index: 60; box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; animation: slide 0.22s ease;
}
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head, .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.drawer-body, .modal-body { padding: 16px 18px; overflow: auto; flex: 1; }
.drawer-actions, .modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
.detail-kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 0.9rem; margin-bottom: 16px; }
.detail-kv dt { color: var(--muted); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.checklist li:last-child { border-bottom: 0; }
.checklist li.done span { text-decoration: line-through; color: var(--muted); }
.checklist input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }

.modal-backdrop { display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 70; }
.modal {
  width: min(560px, 100%); max-height: min(92vh, 820px); overflow: auto;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
  animation: pop 0.18s ease;
}
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.span-2 { grid-column: span 2; }
.field label { font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.field textarea { min-height: 72px; resize: vertical; }

.toast-root { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 0.85rem; box-shadow: var(--shadow-lg); }

.bottom-nav { display: none; }
.progress-mini { font-size: 0.72rem; color: var(--muted); }

@media (max-width: 980px) {
  .stat-grid, .dash-grid { grid-template-columns: 1fr 1fr; }
  .menu-btn { display: inline-flex; }
  .tickets-view { grid-template-columns: 1fr; padding: 12px; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 55; width: min(320px, 90vw);
    border-radius: 0; transform: translateX(-105%); transition: transform 0.2s ease; overflow: auto;
  }
  body.sidebar-open .sidebar { transform: none; }
  .close-sidebar { display: inline-flex; }
  .main-nav { display: none; }
  .brand-text span { display: none; }
  .ticket-row { grid-template-columns: 52px 1fr; }
  .ticket-row .assignee, .ticket-row .pills-end { grid-column: 2; }
}
@media (max-width: 720px) {
  :root { --bottom: 64px; --topbar: 58px; }
  .view { padding: 14px 12px 24px; }
  .stat-grid, .dash-grid, .form-grid { grid-template-columns: 1fr; }
  .field.span-2 { grid-column: span 1; }
  .user-switcher select { max-width: 120px; }
  .punch-btn { display: none; }
  .create-cluster { width: 100%; }
  .split-btn { flex: 1; }
  .split-btn .btn:first-child { flex: 1; }
  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  }
  .bottom-nav button { flex: 1; border-radius: 0; font-size: 0.68rem; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
  .drawer { width: 100%; }
  th:nth-child(n+5), td:nth-child(n+5) { display: none; }
}

        byHour.get(h).push(t);
      }

      const interesting = hours.filter((h) => byHour.has(h) || (h >= 6 && h <= 23));
      board.innerHTML = head + interesting.map((h) => {
        const items = byHour.get(h) || [];
        return "<div class=\"hour-block" + (items.length ? "" : " empty") + "\">" +
          "<div class=\"hour-label\">" + String(h).padStart(2, "0") + ":00</div>" +
          "<div class=\"hour-tickets\">" + items.map(ticketRow).join("") + "</div></div>";
      }).join("");

  function renderCalendar() {
    const parts = ui.calMonth.split("-");
    const year = Number(parts[0]);
    const month = Number(parts[1]);
    const first = new Date(ui.calMonth + "-01T12:00:00+04:00");
    const startWd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(
      new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" }).format(first)
    );
    const daysIn = new Date(year, month, 0).getDate();
    const prevDays = new Date(year, month - 1, 0).getDate();
    const marked = datesWithTickets();
    const today = todayYmd();
    const cells = [];
    for (let i = 0; i < startWd; i++) {
      const day = prevDays - startWd + 1 + i;
      const m = month === 1 ? 12 : month - 1;
      const y = month === 1 ? year - 1 : year;
      cells.push({ id: y + "-" + String(m).padStart(2, "0") + "-" + String(day).padStart(2, "0"), day: day, outside: true });
    }
    for (let d = 1; d <= daysIn; d++) {
      cells.push({ id: year + "-" + String(month).padStart(2, "0") + "-" + String(d).padStart(2, "0"), day: d, outside: false });
    }
    while (cells.length % 7) {
      const d = cells.length - (startWd + daysIn) + 1;
      const m = month === 12 ? 1 : month + 1;
      const y = month === 12 ? year + 1 : year;
      cells.push({ id: y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0"), day: d, outside: true });
    }
    const title = first.toLocaleDateString("en-GB", { timeZone: TZ, month: "long", year: "numeric" });
    $("#mini-calendar").innerHTML =
      "<div class=\"cal-head\">" +
        "<button type=\"button\" class=\"icon-btn\" data-action=\"cal-prev\" aria-label=\"Previous month\">‹</button>" +
        "<strong>" + esc(title) + "</strong>" +
        "<button type=\"button\" class=\"icon-btn\" data-action=\"cal-next\" aria-label=\"Next month\">›</button>" +
      "</div><div class=\"cal-grid\">" +
        ["S","M","T","W","T","F","S"].map((d) => "<div class=\"dow\">" + d + "</div>").join("") +
        cells.map((c) => {
          const cls = (c.outside ? "outside " : "") + (c.id === today ? "today " : "") + (c.id === ui.selectedDate ? "selected " : "") + (marked.has(c.id) ? "has-tickets" : "");
          return "<button type=\"button\" data-action=\"pick-date\" data-date=\"" + c.id + "\" class=\"" + cls.trim() + "\">" + c.day + "</button>";
        }).join("") +
      "</div>";
  }

  function countForSaved(sf) {
    const snap = Object.assign({}, ui, sf.filters);
    const assignee = resolvedAssignee(snap.assignee);
    return state.tickets.filter((t) => {
      if (snap.status === "open" && t.status === "closed") return false;
      if (snap.status === "closed" && t.status !== "closed") return false;
      if (snap.type && t.type !== snap.type) return false;
      if (snap.department && t.department !== snap.department) return false;
      if (assignee && t.assigneeId !== assignee) return false;
      if (snap.overdueOnly && !isOverdue(t)) return false;
      if (snap.range === "today" && ymd(new Date(t.dueAt)) !== ui.selectedDate) return false;
      return true;
    }).length;

  function defaultDue(tpl) {
    const date = ui.selectedDate || todayYmd();
    if (tpl && tpl.dueHour != null) return new Date(dubaiISO(date, tpl.dueHour, 0));
    const p = zonedParts();
    let h = parseInt(p.hour, 10);
    let m = Math.ceil(parseInt(p.minute, 10) / 15) * 15;
    if (m === 60) { m = 0; h += 1; }
    if (ymd(new Date()) !== date) return new Date(dubaiISO(date, 10, 0));
    return new Date(dubaiISO(date, h, m));
  }

    return "<div class=\"block-title\"><h3>Checklist</h3><button type=\"button\" class=\"text-btn\" data-action=\"add-check-item\">Add item</button></div>" +
      "<ul class=\"checklist\" id=\"form-check-list\">" +
      items.map((item, i) => "<li><input type=\"checkbox\"" + (item.done ? " checked" : "") + " data-idx=\"" + i + "\" class=\"form-check-done\" />" +
        "<input type=\"text\" value=\"" + esc(item.text) + "\" data-idx=\"" + i + "\" class=\"form-check-text\" style=\"flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)\" />" +
        "<button type=\"button\" class=\"text-btn\" data-action=\"remove-check-item\" data-idx=\"" + i + "\">Remove</button></li>").join("") +
      (items.length ? "" : "<li class=\"muted\">No checklist items. Use Add item for a task list.</li>") +
      "</ul>";
  }

  function readFormChecklist() {
    const texts = $$(".form-check-text");
    const dones = $$(".form-check-done");
    return texts.map((input, i) => ({
      id: uid("c"),
      text: input.value.trim(),
      done: !!(dones[i] && dones[i].checked)
    })).filter((x) => x.text);
  }

  function openTicketForm(opts) {
    const t = opts.ticket || null;
    const type = t ? t.type : (opts.type || "guest");
    const tpl = opts.template || null;
    const guestPrefill = opts.guestId || (t && t.guestId) || "";
    const due = t ? new Date(t.dueAt) : defaultDue(tpl);
    const dueParts = zonedParts(due);
    const dueDate = dueParts.year + "-" + dueParts.month + "-" + dueParts.day;
    const dueTime = dueParts.hour + ":" + dueParts.minute;
    const summary = (t && t.summary) || (tpl && tpl.summary) || "";
    const department = (t && t.department) || (tpl && tpl.department) || "bell";
    const gPre = guestPrefill ? guestById(guestPrefill) : null;
    const room = (t && t.room) || (gPre && gPre.room) || "";
    const notes = (t && t.notes) || "";
    const assignee = (t && t.assigneeId) || state.currentUserId;
    const status = (t && t.status) || "open";
    const checklist = (t && t.checklist) || (tpl ? tpl.checklist.map((text) => ({ id: uid("c"), text: text, done: false })) : []);

    $("#modal-root").innerHTML =
      "<div class=\"modal-backdrop\" data-action=\"close-modal\">" +
        "<div class=\"modal\" role=\"dialog\" aria-labelledby=\"form-title\" data-stop=\"1\">" +
          "<form id=\"ticket-form\">" +
            "<div class=\"modal-head\"><div><div class=\"muted\">" + (t ? esc(t.id) : "New " + (type === "guest" ? "guest" : "internal") + " request") + "</div>" +
              "<h2 id=\"form-title\" style=\"font-size:1.3rem\">" + (t ? "Edit ticket" : esc(tpl ? tpl.name : "New ticket")) + "</h2></div>" +
              "<button type=\"button\" class=\"icon-btn\" data-action=\"close-modal\" aria-label=\"Close\">×</button></div>" +
            "<div class=\"modal-body\">" +
              "<input type=\"hidden\" name=\"id\" value=\"" + (t ? esc(t.id) : "") + "\" />" +
              "<input type=\"hidden\" name=\"type\" value=\"" + esc(type) + "\" />" +
              "<div class=\"form-grid\">" +
                "<div class=\"field\"><label>Department</label><select name=\"department\">" +
                  DEPTS.map((d) => "<option value=\"" + d.id + "\"" + (d.id === department ? " selected" : "") + ">" + esc(d.name) + "</option>").join("") +
                "</select></div>" +
                "<div class=\"field\"><label>Status</label><select name=\"status\">" +
                  "<option value=\"open\"" + (status === "open" ? " selected" : "") + ">Open</option>" +
                  "<option value=\"in_progress\"" + (status === "in_progress" ? " selected" : "") + ">In progress</option>" +
                  "<option value=\"closed\"" + (status === "closed" ? " selected" : "") + ">Closed</option>" +
                "</select></div>" +
                "<div class=\"field span-2\"><label>Guest</label><select name=\"guestId\" id=\"form-guest\">" +
                  "<option value=\"\">No guest</option>" +
                  state.guests.map((g) => "<option value=\"" + g.id + "\"" + (g.id === guestPrefill ? " selected" : "") + ">" + esc(g.room + " — " + guestName(g)) + "</option>").join("") +
                "</select></div>" +
                "<div class=\"field\"><label>Room</label><input name=\"room\" id=\"form-room\" value=\"" + esc(room) + "\" placeholder=\"e.g. 1204\" /></div>" +
                "<div class=\"field\"><label>Assignee</label><select name=\"assigneeId\">" +
                  state.staff.map((s) => "<option value=\"" + s.id + "\"" + (s.id === assignee ? " selected" : "") + ">" + esc(s.name) + "</option>").join("") +
                  "<option value=\"\"" + (!assignee ? " selected" : "") + ">Unassigned</option>" +
                "</select></div>" +
                "<div class=\"field span-2\"><label>Summary</label><input name=\"summary\" required value=\"" + esc(summary) + "\" placeholder=\"What needs to be done?\" /></div>" +
                "<div class=\"field\"><label>Due date</label><input type=\"date\" name=\"dueDate\" required value=\"" + esc(dueDate) + "\" /></div>" +
                "<div class=\"field\"><label>Due time</label><input type=\"time\" name=\"dueTime\" required value=\"" + esc(dueTime) + "\" /></div>" +
                "<div class=\"field span-2\"><label>Notes</label><textarea name=\"notes\" placeholder=\"Vehicle type, piece count, special instructions…\">" + esc(notes) + "</textarea></div>" +
              "</div><div style=\"margin-top:14px\" id=\"form-check-wrap\">" + renderFormChecklist(checklist) + "</div>" +
            "</div><div class=\"modal-foot\">" +
              "<button type=\"submit\" class=\"btn btn-primary\">" + (t ? "Save changes" : "Create ticket") + "</button>" +
              "<button type=\"button\" class=\"btn btn-ghost\" data-action=\"close-modal\">Cancel</button>" +
            "</div></form></div></div>";
  }

  function toast(msg) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $("#toast-root").appendChild(el);
    setTimeout(function () { el.remove(); }, 2400);
  }

  function closeFavs() {
    $$(".fav-menu").forEach((m) => { m.hidden = true; });
  }

  function onClick(e) {
    const actionEl = e.target.closest("[data-action]");
    if (e.target.classList.contains("modal-backdrop")) {
      closeModal();
      return;
    }
    const favBtn = e.target.closest("[data-action='toggle-favs']");
    if (!favBtn && !e.target.closest(".fav-menu")) closeFavs();
    if (!actionEl) return;
    if (actionEl.classList.contains("modal-backdrop")) return;
    const a = actionEl.dataset.action;
    if (EXT.onClick(a, actionEl, e)) return;
    if (EXT.onClickDining && EXT.onClickDining(a, actionEl, e)) return;

    if (a === "nav") {
      ui.view = actionEl.dataset.view;
      ui.sidebarOpen = false;
      closeDrawer();
      render();
    } else if (a === "toggle-theme") {
      state.theme = state.theme === "dark" ? "light" : "dark";
      persist(); render();
    } else if (a === "toggle-punch") {
      const u = currentUser();
      u.punchedIn = !u.punchedIn;
      persist(); render();
      toast(u.punchedIn ? "Punched in" : "Punched out");
    } else if (a === "toggle-sidebar") {
      ui.sidebarOpen = !ui.sidebarOpen;
      render();
    } else if (a === "toggle-favs") {
      const menu = $("#favs-" + actionEl.dataset.type);
      const was = menu.hidden;
      closeFavs();
      menu.hidden = !was;
    } else if (a === "set-range") {
      ui.range = actionEl.dataset.range;
      if (ui.range === "today" && !ui.selectedDate) ui.selectedDate = todayYmd();
      ui.activeSaved = "";
      render();
    } else if (a === "set-status") {
      ui.status = actionEl.dataset.status;
      ui.activeSaved = "";
      render();
    } else if (a === "pick-date") {
      ui.selectedDate = actionEl.dataset.date;
      ui.range = "today";
      ui.activeSaved = "";
      ui.sidebarOpen = false;
      render();
    } else if (a === "cal-prev") { shiftMonth(-1); render(); }
    else if (a === "cal-next") { shiftMonth(1); render(); }
    else if (a === "apply-saved") {
      const sf = state.savedFilters.find((x) => x.id === actionEl.dataset.id);
      if (!sf) return;
      ui.status = sf.filters.status;
      ui.range = sf.filters.range;
      ui.type = sf.filters.type || "";
      ui.department = sf.filters.department || "";
      ui.assignee = sf.filters.assignee || "";
      ui.overdueOnly = !!sf.filters.overdueOnly;
      ui.activeSaved = sf.id;
      ui.view = "tickets";
      render();
    } else if (a === "save-filter") {
      const name = prompt("Name this filter");
      if (!name || !name.trim()) return;
      state.savedFilters.push({
        id: uid("sf"),
        name: name.trim(),
        filters: { status: ui.status, range: ui.range, type: ui.type, department: ui.department, assignee: ui.assignee, overdueOnly: ui.overdueOnly }
      });
      persist(); render();
      toast("Filter saved");
    } else if (a === "clear-chip") {
      const k = actionEl.dataset.key;
      if (k === "range") ui.range = "all";
      if (k === "status") ui.status = "all";
      if (k === "type") ui.type = "";
      if (k === "department") ui.department = "";
      if (k === "assignee") ui.assignee = "";
      if (k === "overdueOnly") ui.overdueOnly = false;
      if (k === "q") ui.q = "";
      ui.activeSaved = "";
      render();
    } else if (a === "new-ticket") {
      closeFavs();
      openTicketForm({ type: actionEl.dataset.type });
    } else if (a === "use-template") {
      closeFavs();
      const tpl = TPL_MAP[actionEl.dataset.id];
      ui.view = "tickets";
      ui.sidebarOpen = false;
      render();
      openTicketForm({ type: tpl.type, template: tpl });
    } else if (a === "open-ticket") {
      openTicket(actionEl.dataset.id);
    } else if (a === "open-guest") {
      openGuest(actionEl.dataset.id);
    } else if (a === "close-drawer") { closeDrawer(); }
    else if (a === "close-modal") { closeModal(); }
    else if (a === "edit-ticket") {
      const ticket = ticketById(actionEl.dataset.id);
      closeDrawer();
      openTicketForm({ ticket: ticket, type: ticket.type });
    } else if (a === "set-ticket-status") {
      const ticket = ticketById(actionEl.dataset.id);
      ticket.status = actionEl.dataset.status;
      persist();
      openTicket(ticket.id);
      render();
      toast(ticket.status === "closed" ? "Ticket closed" : statusLabel(ticket.status));
    } else if (a === "assign-ticket") {
      const ticket = ticketById(actionEl.dataset.id);
      ticket.assigneeId = $("#assign-select").value;
      persist();
      openTicket(ticket.id);
      render();
      toast("Assignee updated");
    } else if (a === "toggle-check") {
      const ticket = ticketById(actionEl.dataset.tid);
      const item = ticket.checklist.find((c) => c.id === actionEl.dataset.cid);
      item.done = actionEl.checked;
      if (item.done && ticket.status === "open") ticket.status = "in_progress";
      persist();
      openTicket(ticket.id);
      render();
    } else if (a === "new-for-guest") {
      const g = guestById(actionEl.dataset.id);
      closeDrawer();
      openTicketForm({ type: "guest", guestId: g.id });
    } else if (a === "dash-filter") {
      ui.view = "tickets";
      ui.type = ""; ui.department = ""; ui.assignee = ""; ui.q = "";
      if (actionEl.dataset.kind === "open") { ui.status = "open"; ui.range = "all"; ui.overdueOnly = false; }
      if (actionEl.dataset.kind === "overdue") { ui.status = "open"; ui.range = "all"; ui.overdueOnly = true; }
      if (actionEl.dataset.kind === "today") { ui.status = "open"; ui.range = "today"; ui.selectedDate = todayYmd(); ui.overdueOnly = false; }
      ui.activeSaved = "";
      render();
    } else if (a === "dash-dept") {
      ui.view = "tickets";
      ui.status = "open"; ui.range = "all"; ui.department = actionEl.dataset.dept;
      ui.type = ""; ui.assignee = ""; ui.overdueOnly = false; ui.activeSaved = "";
      render();
    } else if (a === "switch-user") {
      state.currentUserId = actionEl.dataset.id;
      persist(); render();
      toast("Now working as " + currentUser().name);
    } else if (a === "reset-demo") {
      if (!confirm("Reset all tickets, filters and punch status back to the sample data?")) return;
      const theme = state.theme;
      state = seed();
      state.theme = theme;
      persist();
      ui.q = ""; ui.guestQ = ""; ui.activeSaved = ""; ui.type = ""; ui.department = ""; ui.assignee = "";
      ui.overdueOnly = false; ui.status = "open"; ui.range = "today"; ui.selectedDate = todayYmd();
      render();
      toast("Demo data restored");
    } else if (a === "add-check-item") {
      const items = readFormChecklist();
      items.push({ id: uid("c"), text: "", done: false });
      $("#form-check-wrap").innerHTML = renderFormChecklist(items);
    } else if (a === "remove-check-item") {
      const items = readFormChecklist();
      items.splice(Number(actionEl.dataset.idx), 1);
      $("#form-check-wrap").innerHTML = renderFormChecklist(items);
    }
  }

  function onChange(e) {
    if (EXT.onChange(e) || (EXT.onChangeDining && EXT.onChangeDining(e))) return;
    if (e.target.id === "user-select") {
      state.currentUserId = e.target.value;
      persist(); render();
    }
    if (e.target.id === "form-guest") {
      const g = guestById(e.target.value);
      const room = $("#form-room");
      if (g && room) room.value = g.room;
    }
  }

  function onInput(e) {
    if (e.target.id === "ticket-search") {
      ui.q = e.target.value;
      ui.activeSaved = "";
      renderTickets();
    }
    if (e.target.id === "guest-search") {
      ui.guestQ = e.target.value;
      renderGuests();
    }
  }

  function onSubmit(e) {
    if (EXT.onSubmitDining && EXT.onSubmitDining(e)) return;
    if (e.target.getAttribute("id") !== "ticket-form") return;
    e.preventDefault();
    const fd = new FormData(e.target);
    const timeParts = String(fd.get("dueTime") || "10:00").split(":").map(Number);
    const dueAt = dubaiISO(fd.get("dueDate"), timeParts[0], timeParts[1]);
    const checklist = readFormChecklist();
    const id = fd.get("id") || nextTicketId();
    const existing = ticketById(id);
    const record = {
      id: id,
      type: fd.get("type"),
      department: fd.get("department"),
      room: String(fd.get("room") || "").trim(),
      guestId: fd.get("guestId") || null,
      summary: String(fd.get("summary") || "").trim(),
      notes: String(fd.get("notes") || "").trim(),
      assigneeId: fd.get("assigneeId") || "",
      createdById: existing ? existing.createdById : state.currentUserId,
      status: fd.get("status"),
      dueAt: dueAt,
      createdAt: existing ? existing.createdAt : new Date().toISOString(),
      checklist: checklist.length ? checklist : null
    };
    if (existing) {
      Object.assign(existing, record);
      toast("Ticket updated");
    } else {
      state.tickets.push(record);
      toast("Ticket created");
    }
    persist();
    closeModal();
    ui.view = "tickets";
    ui.selectedDate = ymd(new Date(dueAt));
    ui.calMonth = ui.selectedDate.slice(0, 7);
    render();
    openTicket(id);
  }

  function onKey(e) {
    if (e.key === "Escape") {
      closeFavs();
      closeModal();
      closeDrawer();
      if (ui.sidebarOpen) { ui.sidebarOpen = false; render(); }
    }
  }

  function openModal(title, bodyHtml, footHtml) {
    $("#modal-root").innerHTML =
      "<div class=\"modal-backdrop\" data-action=\"close-modal\"><div class=\"modal\" role=\"dialog\" data-stop=\"1\">" +
        "<div class=\"modal-head\"><h2 style=\"font-size:1.25rem\">" + esc(title) + "</h2><button type=\"button\" class=\"icon-btn\" data-action=\"close-modal\" aria-label=\"Close\">×</button></div>" +
        "<div class=\"modal-body\">" + bodyHtml + "</div>" + (footHtml ? "<div class=\"modal-foot\">" + footHtml + "</div>" : "") +
      "</div></div>";
  }
  const core = {
    getState: () => state, persist, render, renderChrome, toast, openModal, closeModal, closeDrawer, ui,
    go(view) { ui.view = view; closeDrawer(); render(); window.scrollTo(0, 0); }
  };

  async function init() {
    document.addEventListener("click", onClick);
    document.addEventListener("change", onChange);
    document.addEventListener("input", function (e) { if (EXT.onInputDining && EXT.onInputDining(e)) return; onInput(e); });
    document.addEventListener("submit", onSubmit);
    document.addEventListener("keydown", onKey);
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }
    state = await EXT.boot(core);
    applyTheme();
    ui.selectedDate = todayYmd();
    ui.calMonth = ui.selectedDate.slice(0, 7);
    try {
      const params = new URLSearchParams(location.search);
      const allowed = ["dashboard", "tickets", "guests", "tasks", "staff", "account"];
      if (allowed.includes(params.get("view"))) ui.view = params.get("view");
    } catch (e) {}
    document.body.classList.add("ready");
    render();
  }

  init();
})();

</script>
</body>
</html>
