  <style>
:root {
  --bg: #f4efe6;
  --bg-2: #ece5d8;
  --surface: #fffdf8;
  --surface-2: #f8f3ea;
  --ink: #1c1915;
  --muted: #6b645a;
  --line: #e3d9c8;
  --line-strong: #cfc3ad;
  --accent: #2c4a42;
  --accent-ink: #f4efe6;
  --gold: #8a6a3a;
  --gold-soft: #d4b483;
  --overdue: #9c3a2c;
  --overdue-bg: #f8e8e4;
  --ok: #2c6e4f;
  --ok-bg: #e4f0e9;
  --progress: #8a6a3a;
  --progress-bg: #f3ead8;
  --closed: #6b645a;
  --shadow: 0 10px 30px rgba(28, 25, 21, 0.08);
  --shadow-lg: 0 24px 60px rgba(28, 25, 21, 0.16);
  --radius: 14px;
  --radius-sm: 8px;
  --font: "Outfit", "Segoe UI", system-ui, sans-serif;
  --serif: "Fraunces", "Palatino Linotype", Palatino, Georgia, serif;
  --topbar: 64px;
  --bottom: 0px;
  --sidebar: 268px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #161412;
  --bg-2: #1e1b18;
  --surface: #221f1b;
  --surface-2: #2a2621;
  --ink: #f3eee6;
  --muted: #a89f92;
  --line: #3a342c;
  --line-strong: #52493d;
  --accent: #c9a46a;
  --accent-ink: #1c1915;
  --gold: #d4b483;
  --gold-soft: #8a6a3a;
  --overdue: #f0a398;
  --overdue-bg: #3a221f;
  --ok: #8fcead;
  --ok-bg: #1d3228;
  --progress: #e2c48a;
  --progress-bg: #3a3120;
  --closed: #a89f92;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
[data-theme="dark"] .icon-sun { display: none; }
[data-theme="light"] .icon-moon, :root:not([data-theme="dark"]) .icon-moon { display: none; }
[data-theme="dark"] .icon-moon { display: block; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: 0.01em;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-family: var(--font); font-weight: 600; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

#app { min-height: 100%; display: flex; flex-direction: column; }
#main { flex: 1; padding-bottom: var(--bottom); }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar);
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px 0 18px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.brand-mark { border-radius: 7px; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; }
.brand-text span { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em; }
.main-nav { display: flex; gap: 2px; flex: 1; justify-content: center; }
.main-nav button, .bottom-nav button {
  border: 0; background: transparent; color: var(--muted);
  padding: 8px 14px; border-radius: 999px; font-weight: 500;
}
.main-nav button:hover, .bottom-nav button:hover { background: var(--bg-2); color: var(--ink); }
.main-nav button.active, .bottom-nav button.active { background: var(--accent); color: var(--accent-ink); }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
}
.icon-btn:hover { border-color: var(--line-strong); background: var(--bg-2); }
.menu-btn { display: none; }
.punch-btn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; font-weight: 500;
}
.punch-btn.on { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.user-switcher select {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 28px 6px 12px; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236b645a' d='M1 1l5 5 5-5'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; max-width: 180px;
}

/* Buttons */
.btn {
  border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 10px; padding: 8px 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--bg-2); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-danger { background: var(--overdue); color: #fff; border-color: transparent; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--bg-2); color: var(--ink); }
.text-btn { border: 0; background: none; color: var(--gold); font-size: 0.75rem; font-weight: 600; padding: 0; }
.split-btn { position: relative; display: inline-flex; }
.split-btn .btn { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split-btn .btn-caret {
  border-top-left-radius: 0; border-bottom-left-radius: 0;
  border-left: 1px solid color-mix(in srgb, var(--accent-ink) 25%, transparent);
  padding-left: 8px; padding-right: 8px; min-width: 32px;
}
.split-btn .btn:not(.btn-primary) + .btn-caret { border-left-color: var(--line-strong); }
.fav-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  min-width: 260px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px;
}
.fav-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 8px 10px; border-radius: 6px; font-size: 0.9rem;
}
.fav-menu button:hover { background: var(--bg-2); }
.fav-menu .fav-meta { display: block; font-size: 0.7rem; color: var(--muted); }

/* Views */
.view { padding: 20px 24px 40px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.lede { color: var(--muted); margin-top: 4px; }

/* Dashboard */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 18px 16px; box-shadow: var(--shadow);
}
.stat-card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.stat-card .num { font-family: var(--serif); font-size: 2.2rem; margin-top: 6px; line-height: 1; }
.stat-card.overdue .num { color: var(--overdue); }
.stat-card.open .num { color: var(--ok); }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.panel h2 { margin-bottom: 14px; }
.dept-row { display: grid; grid-template-columns: 120px 1fr 28px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 0.88rem; }
.bar { height: 8px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; }
.list-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer;
}
.list-row:last-child { border-bottom: 0; }
.list-row:hover { color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.muted { color: var(--muted); font-size: 0.82rem; }
.empty { color: var(--muted); padding: 28px 8px; text-align: center; }

/* Tickets layout */
.tickets-view { display: grid; grid-template-columns: var(--sidebar) 1fr; gap: 20px; padding: 16px 16px 40px 12px; align-items: start; }
.sidebar {
  position: sticky; top: calc(var(--topbar) + 16px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
}
.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.close-sidebar { display: none; }
.sidebar-block { margin-top: 18px; }
.block-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.filter-list, .quick-links { display: flex; flex-direction: column; gap: 2px; }
.filter-list button, .quick-links button, .chip {
  border: 0; background: transparent; text-align: left; padding: 7px 8px; border-radius: 8px; color: var(--ink);
}
.filter-list button:hover, .quick-links button:hover, .chip:hover { background: var(--bg-2); }
.filter-list button.active { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); font-weight: 600; }
.filter-list .count, .chip .count { float: right; color: var(--muted); font-size: 0.75rem; }
.quick-links button { font-size: 0.86rem; }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head strong { font-family: var(--serif); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grid .dow { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; padding: 4px 0; text-transform: uppercase; }
.cal-grid button {
  border: 0; background: transparent; border-radius: 8px; height: 32px; position: relative; font-size: 0.8rem;
}
.cal-grid button:hover { background: var(--bg-2); }
.cal-grid button.today { box-shadow: inset 0 0 0 1px var(--gold); }
.cal-grid button.selected { background: var(--accent); color: var(--accent-ink); }
.cal-grid button.outside { color: var(--line-strong); }
.cal-grid button.has-tickets::after {
  content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--gold);
  position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
}
.cal-grid button.selected.has-tickets::after { background: var(--accent-ink); }

/* Toolbar */
.tickets-main { min-width: 0; }
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.create-cluster, .toolbar-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; color: var(--muted); font-size: 0.82rem; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.active { background: var(--ink); color: var(--bg); }
.search-field { flex: 1; min-width: 180px; }
.search-field.wide { min-width: 260px; max-width: 420px; }
.search-field input, .field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 8px 12px; outline: none;
}
.search-field input:focus, .field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent);
}
.chip-bar { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; margin-bottom: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line) !important; border-radius: 999px; padding: 4px 8px 4px 10px; font-size: 0.78rem;
}
.chip .x { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 1rem; line-height: 1; }

/* Timeline */
.tickets-board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.board-meta { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; display: flex; justify-content: space-between; }
.hour-block { display: grid; grid-template-columns: 64px 1fr; border-bottom: 1px solid var(--line); }
.hour-block:last-child { border-bottom: 0; }
.hour-block.empty { opacity: 0.55; }
.hour-label {
  padding: 10px 8px 10px 14px; font-size: 0.75rem; font-weight: 600; color: var(--muted);
  border-right: 1px solid var(--line); background: var(--surface-2);
}
.hour-tickets { padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 20px; }
.ticket-row {
  display: grid; grid-template-columns: 64px 1fr auto auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--bg);
  border: 1px solid transparent; border-left: 4px solid var(--dept, var(--gold));
  cursor: pointer; text-align: left;
}
.ticket-row:hover { border-color: var(--line-strong); border-left-color: var(--dept, var(--gold)); }
.ticket-row.overdue { background: var(--overdue-bg); }
.ticket-row.closed { opacity: 0.62; }
.ticket-row .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.82rem; }
.ticket-row .sum { min-width: 0; }
.ticket-row .sum strong { display: block; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket-row .sum span { color: var(--muted); font-size: 0.75rem; }
.pill {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px;
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--bg-2); color: var(--muted); white-space: nowrap;
}
.pill.open { background: var(--ok-bg); color: var(--ok); }
.pill.in_progress { background: var(--progress-bg); color: var(--progress); }
.pill.closed { background: var(--bg-2); color: var(--closed); }
.pill.overdue { background: var(--overdue); color: #fff; }
.pill.guest { background: #e7eef2; color: #3b6e8a; }
.pill.internal { background: #f1eadf; color: #8a6a3a; }
[data-theme="dark"] .pill.guest { background: #1e2c34; color: #8eb6c8; }
[data-theme="dark"] .pill.internal { background: #32291c; color: #d4b483; }
.assignee { font-size: 0.75rem; color: var(--muted); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Ticket cards (mobile / all-time list) */
.ticket-list { display: flex; flex-direction: column; }
.ticket-card {
  display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; padding: 14px 16px; border-left: 4px solid var(--dept, var(--gold));
  cursor: pointer;
}
.ticket-card:hover { background: var(--bg); }
.ticket-card.overdue { background: var(--overdue-bg); }
.ticket-card .card-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ticket-card h4 { font-family: var(--font); font-size: 0.95rem; font-weight: 550; margin: 0; }
.ticket-card .meta { color: var(--muted); font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 8px; }

/* Guests */
.table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 0.9rem; }

tr { cursor: pointer; }

/* Staff / tasks */
.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.staff-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);

}
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; font-size: 0.85rem;
}

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--line-strong); }
.status-dot.on { background: var(--ok); }

/* Drawer + modal */
.drawer-backdrop, .modal-backdrop, .sidebar-backdrop {
  position: fixed; inset: 0; background: rgba(28, 25, 21, 0.4); z-index: 50;
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%);

  display: flex; flex-direction: column; animation: slide 0.22s ease;
}
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head, .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }

.drawer-actions, .modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
.detail-kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 0.9rem; margin-bottom: 16px; }
.detail-kv dt { color: var(--muted); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.checklist li:last-child { border-bottom: 0; }
.checklist li.done span { text-decoration: line-through; color: var(--muted); }
.checklist input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }

.modal-backdrop { display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 70; }
.modal {
  width: min(560px, 100%); max-height: min(92vh, 820px); overflow: auto;
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
  animation: pop 0.18s ease;
}
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.span-2 { grid-column: span 2; }
.field label { font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.field textarea { min-height: 72px; resize: vertical; }

.toast-root { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 0.85rem; box-shadow: var(--shadow-lg); }

.bottom-nav { display: none; }
.progress-mini { font-size: 0.72rem; color: var(--muted); }

@media (max-width: 980px) {
  .stat-grid, .dash-grid { grid-template-columns: 1fr 1fr; }
  .menu-btn { display: inline-flex; }
  .tickets-view { grid-template-columns: 1fr; padding: 12px; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 55; width: min(320px, 90vw);
    border-radius: 0; transform: translateX(-105%); transition: transform 0.2s ease; overflow: auto;
  }

@media (max-width: 720px) {

  .create-cluster { width: 100%; }
  .split-btn { flex: 1; }

  .bottom-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  }
  .bottom-nav button { flex: 1; border-radius: 0; font-size: 0.68rem; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; }
  .drawer { width: 100%; }
  th:nth-child(n+5), td:nth-child(n+5) { display: none; }
}

      "<div class=\"field\"><label>Combinable with</label><div class=\"combo-list\">" + (others.length ? others.map((x) => "<label><input type=\"checkbox\" name=\"combo\" value=\"" + x.id + "\"" + ((t.combinable || []).includes(x.id) ? " checked" : "") + " /> " + esc(x.name) + "</label>").join("") : "<span class=\"muted\">No other tables</span>") + "</div></div>" +
      "<div class=\"field\"><label><input type=\"checkbox\" name=\"blocked\"" + (t.state === "blocked" ? " checked" : "") + " /> Blocked (not bookable)</label></div>" +
      "<button type=\"button\" class=\"btn btn-danger\" data-action=\"ed-del-table\">Delete table</button></form>"
      : "<div class=\"props\"><h2>Table properties</h2><p class=\"muted\">Select a table to edit it. Drag tables to move them; drag the corner handle to resize. Changes save and sync live.</p></div>";
    $("#view-editor").innerHTML =
      "<div class=\"view-head\"><div><h1>Floor editor</h1><p class=\"lede\">Outlets, floors/sections and tables for " + esc(EXT.tenant ? EXT.tenant.name : "your hotel") + ".</p></div><button type=\"button\" class=\"btn btn-primary\" data-action=\"ed-add-table\">+ Table</button></div>" +
      "<div class=\"ed-bar\"><label class=\"sr-only\" for=\"ed-outlet\">Outlet</label><select id=\"ed-outlet\">" + state.outlets.map((x) => "<option value=\"" + x.id + "\"" + (x.id === o.id ? " selected" : "") + ">" + esc(x.name) + "</option>").join("") + "</select>" +
      "<button type=\"button\" class=\"btn btn-sm\" data-action=\"ed-add-outlet\">+ Outlet</button><button type=\"button\" class=\"btn btn-sm\" data-action=\"ed-ren-outlet\">Rename</button><button type=\"button\" class=\"btn btn-sm btn-ghost\" data-action=\"ed-del-outlet\">Delete outlet</button></div>" +
      "<div class=\"ed-bar\"><span class=\"muted\">Floors / sections:</span><div class=\"chip-row\">" + o.sections.map((s) => "<button type=\"button\" class=\"chip" + (s.id === ed.section ? " active" : "") + "\" data-action=\"ed-section\" data-id=\"" + s.id + "\">" + esc(s.name) + " · " + state.tables.filter((x) => x.outletId === o.id && x.sectionId === s.id).length + "</button>").join("") + "</div>" +
      "<button type=\"button\" class=\"btn btn-sm\" data-action=\"ed-add-section\">+ Section</button><button type=\"button\" class=\"btn btn-sm\" data-action=\"ed-ren-section\">Rename</button><button type=\"button\" class=\"btn btn-sm btn-ghost\" data-action=\"ed-del-section\">Delete section</button></div>" +
      "<div class=\"ed-grid\"><div class=\"panel\"><div class=\"floor-scroll\"><div class=\"floor editor\" id=\"ed-canvas\">" + canvas + "</div></div><p class=\"muted\" style=\"margin-top:8px\">" + tables.length + " tables · " + tables.reduce((n, x) => n + x.seats, 0) + " seats in this section</p></div><div class=\"panel\">" + props + "</div></div>";
  }
  function edAction(a) {
    const o = outlet(); const t = state.tables.find((x) => x.id === ed.sel);
    if (a === "ed-add-outlet") { const n = prompt("New outlet name"); if (!n) return; const id = "o-" + rnd(); state.outlets.push({ id, name: n.trim(), kind: "Restaurant", color: "#6b4c8a", sections: [{ id: "main", name: "Main room" }], shifts: [{ id: "dinner", name: "Dinner", start: "18:30", end: "23:00" }] }); ed.outlet = id; ed.sel = null; }
    else if (a === "ed-ren-outlet") { const n = prompt("Rename outlet", o.name); if (!n) return; o.name = n.trim(); }
    else if (a === "ed-del-outlet") {
      const active = state.reservations.filter((r) => r.outletId === o.id && ["booked", "confirmed", "seated"].includes(r.status)).length;
      if (active) return toast("Move or cancel " + active + " active reservation(s) first");
      if (!confirm("Delete " + o.name + " and all its tables?")) return;
      state.tables = state.tables.filter((x) => x.outletId !== o.id); state.outlets = state.outlets.filter((x) => x.id !== o.id); ed.outlet = null; ed.sel = null;
    }
    else if (a === "ed-add-section") { const n = prompt("New floor / section name (e.g. Terrace, Mezzanine)"); if (!n) return; const id = "sec-" + rnd(); o.sections.push({ id, name: n.trim() }); ed.section = id; ed.sel = null; }
    else if (a === "ed-ren-section") { const s = o.sections.find((x) => x.id === ed.section); const n = prompt("Rename section", s.name); if (!n) return; s.name = n.trim(); }
    else if (a === "ed-del-section") {
      if (o.sections.length < 2) return toast("An outlet needs at least one section");
      const n = state.tables.filter((x) => x.outletId === o.id && x.sectionId === ed.section).length;
      if (!confirm("Delete this section" + (n ? " and its " + n + " table(s)" : "") + "?")) return;
      state.tables = state.tables.filter((x) => !(x.outletId === o.id && x.sectionId === ed.section)); o.sections = o.sections.filter((x) => x.id !== ed.section); ed.section = o.sections[0].id; ed.sel = null;
    }
    else if (a === "ed-add-table") {
      const used = new Set(state.tables.filter((x) => x.outletId === o.id).map((x) => x.name)); let i = 1; while (used.has("T" + i)) i++;
      const id = o.id + "-" + rnd(); state.tables.push({ id, outletId: o.id, sectionId: ed.section, name: "T" + i, minSeats: 2, seats: 4, shape: "square", x: 50, y: 50, w: 72, h: 64, combinable: [], state: "" }); ed.sel = id;
    }
    else if (a === "ed-del-table") {
      if (!t || !confirm("Delete table " + t.name + "?")) return;
      state.tables = state.tables.filter((x) => x.id !== t.id); state.tables.forEach((x) => { x.combinable = (x.combinable || []).filter((c) => c !== t.id); });
      state.reservations.forEach((r) => { if (r.tableId === t.id || (r.tableIds || []).includes(t.id)) { r.tableIds = (r.tableIds || []).filter((c) => c !== t.id); r.tableId = r.tableIds[0] || null; } }); ed.sel = null;
    } else return false;
    persist(); render(); return true;
  }
  function applyProps(form) {
    const t = state.tables.find((x) => x.id === ed.sel); if (!t) return;
    const fd = new FormData(form), num = (k, d) => Math.max(1, parseInt(fd.get(k), 10) || d);
    t.name = String(fd.get("name") || t.name).trim() || t.name; t.seats = num("seats", t.seats); t.minSeats = Math.min(num("minSeats", 1), t.seats);
    const shape = fd.get("shape"); if (shape !== t.shape) { const sz = { round: [70, 70], square: [72, 64], rect: [116, 64] }[shape]; t.w = sz[0]; t.h = sz[1]; t.shape = shape; } else { t.w = Math.min(260, Math.max(40, num("w", 72))); t.h = Math.min(200, Math.max(40, num("h", 64))); if (t.shape === "round") t.h = t.w; }
    t.sectionId = fd.get("sectionId"); if (t.sectionId !== ed.section) ed.section = t.sectionId;
    const combo = fd.getAll("combo"); const old = t.combinable || []; t.combinable = combo;
    for (const x of state.tables) if (x.id !== t.id && x.outletId === t.outletId) { const has = (x.combinable || []).includes(t.id), want = combo.includes(x.id); if (want && !has) x.combinable = (x.combinable || []).concat(t.id); if (!want && has && old.includes(x.id)) x.combinable = x.combinable.filter((c) => c !== t.id); }
    const blocked = fd.get("blocked") === "on"; if (blocked) t.state = "blocked"; else if (t.state === "blocked") t.state = "";
    persist(); render();
  }
  // drag / resize
  let drag = null;
  document.addEventListener("pointerdown", (e) => {
    const cv = e.target.closest("#ed-canvas"); if (!cv) return;
    const rs = e.target.closest("[data-rs]"), el = e.target.closest("[data-tid]");
    if (!el) { if (ed.sel) { ed.sel = null; render(); } return; }
    const t = state.tables.find((x) => x.id === el.dataset.tid);
    drag = { t, el, cv: cv.getBoundingClientRect(), sx: e.clientX, sy: e.clientY, x: t.x, y: t.y, w: t.w || 72, h: t.h || 64, resize: !!rs, moved: false };
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag) return; const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    if (drag.resize) { drag.nw = Math.min(260, Math.max(40, drag.w + dx * 2)); drag.nh = drag.t.shape === "round" ? drag.nw : Math.min(200, Math.max(40, drag.h + dy * 2)); drag.el.style.width = drag.nw + "px"; drag.el.style.height = drag.nh + "px"; }
    else { drag.nx = Math.min(97, Math.max(3, drag.x + dx / drag.cv.width * 100)); drag.ny = Math.min(95, Math.max(5, drag.y + dy / drag.cv.height * 100)); drag.el.style.left = drag.nx + "%"; drag.el.style.top = drag.ny + "%"; }
  });
  document.addEventListener("pointerup", () => {
    if (!drag) return; const d = drag; drag = null;
    if (d.moved) { if (d.resize) { d.t.w = Math.round(d.nw); d.t.h = Math.round(d.nh); } else { d.t.x = Math.round(d.nx * 10) / 10; d.t.y = Math.round(d.ny * 10) / 10; } persist(); }
    ed.sel = d.t.id; render();
  });

  // ---------------- team (admin) ----------------
  async function renderTeam() {
    const el = $("#view-team");
    el.innerHTML = "<div class=\"view-head\"><div><h1>Team &amp; access</h1><p class=\"lede\">Only accounts created here can sign in to the dining app.</p></div></div><p class=\"muted\">Loading…</p>";
    let r; try { r = await api.accounts(); } catch (e) { return handleErr(e); }
    const st = (a) => a.disabled ? "<span class=\"status-pill disabled\">Disabled</span>" : a.locked ? "<span class=\"status-pill locked\">Locked</span>" : a.mustChange ? "<span class=\"status-pill must\">Must change password</span>" : "<span class=\"status-pill\">Active</span>";
    el.innerHTML = "<div class=\"view-head\"><div><h1>Team &amp; access</h1><p class=\"lede\">Only accounts created here can sign in to the dining app. <span class=\"seat-meter\">Admin seats: <b>" + r.seats.used + " / " + r.seats.limit + "</b> (shared with hotel admins)</span></p></div></div>" +
      "<div class=\"panel\" style=\"margin-bottom:16px\"><h2>Issue a new account</h2><form id=\"dn-create\" class=\"form-grid\" style=\"grid-template-columns:repeat(4,1fr)\"><div class=\"field\"><label>Full name</label><input name=\"name\" required /></div><div class=\"field\"><label>Company email</label><input name=\"email\" type=\"email\" required placeholder=\"name@" + (EXT.tenant && EXT.tenant.id === "t-harbor" ? "harbor" : "aurora") + ".example.com\" /></div>" +
      "<div class=\"field\"><label>Role</label><select name=\"role\"><option value=\"server\">Server</option><option value=\"host\">Host</option><option value=\"dining_admin\">Dining admin</option></select></div><div class=\"field\"><label>Temporary password</label><div style=\"display:flex;gap:6px\"><input name=\"tempPassword\" required value=\"" + genPw() + "\" style=\"flex:1\" /><button type=\"button\" class=\"btn btn-sm\" data-action=\"dn-gen\">↻</button></div></div><div><button type=\"submit\" class=\"btn btn-primary\">Create account</button></div></form></div>" +
      "<div class=\"panel\"><table class=\"data-table\"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Actions</th></tr></thead><tbody>" +
      r.accounts.map((a) => "<tr><td><strong>" + esc(a.name) + "</strong>" + (a.id === me.id ? " <span class=\"muted\">(you)</span>" : "") + "</td><td>" + esc(a.email) + "</td><td><select data-role-of=\"" + a.id + "\">" + Object.keys(ROLE_LABEL).map((k) => "<option value=\"" + k + "\"" + (a.role === k ? " selected" : "") + ">" + ROLE_LABEL[k] + "</option>").join("") + "</select></td><td>" + st(a) + (a.failed && !a.locked ? " <span class=\"muted\">" + a.failed + " failed</span>" : "") + "</td><td>" + (a.lastLogin ? esc(new Date(a.lastLogin).toLocaleString("en-GB", { timeZone: "Asia/Dubai", dateStyle: "medium", timeStyle: "short" })) : "Never") + "</td>" +
        "<td style=\"white-space:nowrap\"><button type=\"button\" class=\"btn btn-sm\" data-action=\"dn-reset\" data-id=\"" + a.id + "\" data-email=\"" + esc(a.email) + "\">Reset password</button> " + (a.locked ? "<button type=\"button\" class=\"btn btn-sm btn-primary\" data-action=\"dn-unlock\" data-id=\"" + a.id + "\">Unlock</button> " : "") +
        "<button type=\"button\" class=\"btn btn-sm\" data-action=\"dn-toggle\" data-id=\"" + a.id + "\" data-dis=\"" + (a.disabled ? "0" : "1") + "\">" + (a.disabled ? "Enable" : "Disable") + "</button> " + (a.id !== me.id ? "<button type=\"button\" class=\"btn btn-sm btn-ghost\" data-action=\"dn-del\" data-id=\"" + a.id + "\">Delete</button>" : "") + "</td></tr>").join("") + "</tbody></table></div>";
  }
  async function renderAudit() {
    const el = $("#view-audit"); let r; try { r = await api.audit(); } catch (e) { return handleErr(e); }
    el.innerHTML = "<div class=\"view-head\"><div><h1>Audit log</h1><p class=\"lede\">Sign-ins, failed attempts, lockouts, account and data changes for " + esc(EXT.tenant ? EXT.tenant.name : "this hotel") + ".</p></div><input type=\"search\" id=\"audit-q\" placeholder=\"Filter…\" style=\"padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)\" /></div>" +
      "<div class=\"panel\"><table class=\"data-table audit-table\"><thead><tr><th>Time (Dubai)</th><th>Who</th><th>App</th><th>Action</th><th>Detail</th><th>IP</th></tr></thead><tbody>" +
      r.entries.map((x) => "<tr><td>" + esc(new Date(x.at).toLocaleString("en-GB", { timeZone: "Asia/Dubai", dateStyle: "short", timeStyle: "medium" })) + "</td><td>" + esc(x.actor) + "</td><td>" + esc(x.app) + "</td><td><b>" + esc(x.action.replace(/_/g, " ")) + "</b></td><td>" + esc(x.detail) + "</td><td>" + esc(x.ip) + "</td></tr>").join("") + "</tbody></table></div>";
  }
  function renderMe() {
    const os = /iPhone|iPad/.test(navigator.userAgent) ? "Safari → Share → Add to Home Screen" : /Android/.test(navigator.userAgent) ? "Chrome → ⋮ → Install app" : "Chrome/Edge → install icon in the address bar · Mac Safari → File → Add to Dock";
    $("#view-me").innerHTML = "<div class=\"view-head\"><div><h1>" + esc(me.name) + "</h1><p class=\"lede\">" + esc(me.email) + " · <span class=\"pill open\">" + esc(ROLE_LABEL[me.role]) + "</span></p></div><button type=\"button\" class=\"btn\" data-action=\"dn-signout\">Sign out</button></div>" +
      "<div class=\"dash-grid\"><div class=\"panel\"><h2>Change password</h2><form id=\"dn-pw\" class=\"props\"><div class=\"field\"><label>Current password</label><input type=\"password\" name=\"current\" required /></div><div class=\"field\"><label>New password</label><input type=\"password\" name=\"next\" minlength=\"8\" required /></div><div class=\"field\"><label>Repeat</label><input type=\"password\" name=\"again\" minlength=\"8\" required /></div><button class=\"btn btn-primary\" type=\"submit\">Update password</button></form></div>" +
      "<div class=\"panel\"><h2>Install this app</h2><p>The dining app installs separately from the hotel app, in its own window.</p><p class=\"muted\" style=\"margin:8px 0\">On this device: " + esc(os) + "</p><button type=\"button\" class=\"btn btn-primary\" data-action=\"install\">Install Concierge Dining</button><p class=\"muted\" style=\"margin-top:10px\">Security: sessions end after " + idleMin + " minutes idle (12 hours max); 5 wrong passwords lock the account.</p></div>" +
      (api.local ? "" : "<div class=\"panel\" style=\"grid-column:1/-1\"><h2>Report an issue or idea</h2><form id=\"dn-feedback\" class=\"form-grid\"><div class=\"field\"><label>Type</label><select name=\"kind\"><option value=\"bug\">Problem / bug</option><option value=\"idea\">Idea</option><option value=\"question\">Question</option></select></div><div class=\"field\"><label>Where</label><input name=\"page\" placeholder=\"e.g. Floor editor\" /></div><div class=\"field span-2\"><label>Details</label><textarea name=\"message\" required></textarea></div><div><button class=\"btn btn-primary\" type=\"submit\">Send to developer</button></div></form></div>") + "</div>";
  }

  // ---------------- events ----------------
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; });
  document.addEventListener("click", async (e) => {
    const ann = e.target.closest("[data-ann]"); if (ann) { const s = JSON.parse(localStorage.getItem("cos-ann-dismissed") || "[]"); s.push(ann.dataset.ann); localStorage.setItem("cos-ann-dismissed", JSON.stringify(s)); return showAnnouncements(EXT.announcements || []); }
    if (e.target.classList.contains("modal-backdrop")) return closeModal();
    const el = e.target.closest("[data-action]"); if (!el) return;
    const a = el.dataset.action, id = el.dataset.id;
    try {
      if (a === "close-modal") closeModal();
      else if (a === "close-drawer") closeDrawer();
      else if (a === "install") { if (deferred) { deferred.prompt(); deferred = null; } else openModal("Install Concierge Dining", LOCAL ? "<p class=\"notice\">This is the offline file. To install, open the hosted address /dining/ in your browser.</p>" : "<p><b>iPhone/iPad:</b> Safari → Share → Add to Home Screen.<br /><b>Android:</b> Chrome → ⋮ → Install app.<br /><b>Windows/Linux:</b> Chrome or Edge → install icon in the address bar.<br /><b>Mac:</b> Chrome/Edge install icon, or Safari → File → Add to Dock.</p><p class=\"muted\" style=\"margin-top:8px\">It installs as its own app, separate from the hotel app.</p>", ""); }
      else if (a === "dn-nav") { view = el.dataset.view; closeDrawer(); render(); window.scrollTo(0, 0); }
      else if (a === "dn-signout") { await api.logout().catch(() => {}); localStorage.removeItem(LS_TOKEN); location.reload(); }
      else if (a === "ed-section") { ed.section = id; ed.sel = null; render(); }
      else if (a.startsWith("ed-")) edAction(a);
      else if (a === "dn-gen") { const i = el.parentNode.querySelector("input"); i.value = genPw(); }
      else if (a === "dn-reset") { const pw = genPw(); if (!confirm("Reset password for " + el.dataset.email + "? New temporary password: " + pw)) return; await api.reset(id, { tempPassword: pw }); openModal("Temporary password", "<p>New temporary password for <b>" + esc(el.dataset.email) + "</b>:</p><p style=\"font-family:ui-monospace,monospace;font-size:1.2rem;margin-top:8px\">" + esc(pw) + "</p><p class=\"muted\">They must change it at next sign-in. Their other sessions were signed out.</p>", "<button type=\"button\" class=\"btn btn-primary\" data-action=\"close-modal\">Done</button>"); renderTeam(); }
      else if (a === "dn-unlock") { await api.unlock(id); toast("Account unlocked"); renderTeam(); }
      else if (a === "dn-toggle") { await api.patch(id, { disabled: el.dataset.dis === "1" }); toast(el.dataset.dis === "1" ? "Account disabled" : "Account enabled"); renderTeam(); }
      else if (a === "dn-del") { if (!confirm("Delete this account permanently?")) return; await api.del(id); toast("Account deleted"); renderTeam(); }
      else if (EXT.onClickDining) EXT.onClickDining(a, el, e);
    } catch (err) { handleErr(err); }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id === "ed-outlet") { ed.outlet = e.target.value; ed.section = null; ed.sel = null; return render(); }
    if (e.target.closest("#ed-props")) return applyProps(e.target.closest("#ed-props"));
    if (e.target.matches("[data-role-of]")) { try { await api.patch(e.target.dataset.roleOf, { role: e.target.value }); toast("Role updated"); } catch (err) { toast(err.message); } return renderTeam(); }
    if (EXT.onChangeDining) EXT.onChangeDining(e);
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "audit-q") { const q = e.target.value.toLowerCase(); document.querySelectorAll(".audit-table tbody tr").forEach((r) => { r.hidden = q && !r.textContent.toLowerCase().includes(q); }); return; }
    if (EXT.onInputDining) EXT.onInputDining(e);
  });
  document.addEventListener("submit", (e) => { if (EXT.onSubmitDining) EXT.onSubmitDining(e); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeDrawer(); } });
  if (!LOCAL) {
    let n = 0; const rep = (m, s) => { if (++n > 20) return; fetch("/api/errors", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (localStorage.getItem(LS_TOKEN) || "") }, body: JSON.stringify({ app: "dining", message: m, stack: s, url: location.pathname }) }).catch(() => {}); };
    window.addEventListener("error", (e) => rep(e.message, e.error && e.error.stack));
    window.addEventListener("unhandledrejection", (e) => rep("Unhandled: " + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/dining/sw.js", { scope: "/dining/" }).catch(() => {});
  }

  // ---------------- boot ----------------
  (async function () {
    document.body.classList.add("ready");
    try { const r = await api.me(); await enter(r); } catch (e) { if (e.mustChange) changeScreen(); else loginScreen(e.timeout ? e.message : null); }
  })();
})();
